# ── Application ─────────────────────────────────────────────────────────────
spring.application.name=vibecheck-ai

# ── Database (MySQL) ─────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vibecheck_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── File Upload Limits ───────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# OpenRouter AI Configuration
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
openrouter.api.key=${OPENROUTER_API_KEY}
openrouter.primary.model=google/gemini-2.5-flash
openrouter.fallback.model=

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.karasuno=INFO
logging.level.org.springframework.security=WARN

# ── Judge Demo Accounts ─────────────────────────────────────
app.demo-accounts.enabled=${DEMO_ACCOUNTS_ENABLED:true}
app.demo-accounts.creator-password=${DEMO_CREATOR_PASSWORD:Creator@123}
app.demo-accounts.manager-password=${DEMO_MANAGER_PASSWORD:Manager@123}
app.demo-accounts.admin-password=${DEMO_ADMIN_PASSWORD:Admin@123}